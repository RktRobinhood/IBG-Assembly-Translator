[package]
name = "ibg-subtitle-overlay"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.30.0"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
